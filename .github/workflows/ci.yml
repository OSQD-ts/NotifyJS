name: CI

on:
  # Every branch, not only main. A change here is a branch, and the run that
  # decides whether it reaches main is the one its own push starts.
  #
  # This is not just convenience. A pull request opened by GITHUB_TOKEN does
  # not start a workflow - GitHub refuses to let its own token cascade - so a
  # workflow triggered only by `pull_request` would leave the pull request this
  # repository opens for you with nothing to report, forever. Check runs attach
  # to the head commit rather than to the pull request, so the push run shows
  # up on the pull request all the same.
  push:
    branches: ['**']
  # Kept for anything arriving from a fork, where no push event lands here.
  pull_request:
  # `merge` below dispatches this on main after an automatic merge, because a
  # push made with GITHUB_TOKEN does not trigger one either - and without it
  # main would never be built or scanned, only its branches.
  workflow_dispatch:

# Every job here only reads the repository. Stated explicitly because the
# default token permissions are a repository-level setting: without this, what
# `npm ci`, `expo prebuild` and `gradlew` run with depends on a checkbox
# somewhere else, and all three execute third-party code.
permissions:
  contents: read

# Cancel superseded runs so a burst of pushes does not queue behind itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to the commit they resolved to, not to a tag.
# A tag is a mutable pointer the action's owner can move: anyone who can retag
# can change what runs here, and this workflow holds the publishing
# credentials. The trailing comment is the human-readable version; update both
# together. Nothing bumps these automatically, so `check-action-contracts.mjs`
# is what catches a SHA that was edited to something that no longer fits.

# Every build job below carries the same `if:`. A branch in this repository is
# already covered by its push run, and without the guard each one would build
# the same commit twice - once for the push, once for the pull request that
# push opens. A fork's pull request produces no push event here, so it keeps
# the `pull_request` run and stays covered.

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # See the note above `jobs:`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Test
        run: npm test

  mobile:
    name: Mobile app typecheck and bundle
    runs-on: ubuntu-latest
    # See the note above `jobs:`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The app resolves @osqd/notifyjs-protocol through `file:../protocol`, whose
      # entry point is its build output.
      - run: npm run build

      # `ci`, not `install`: the lockfile is what makes this build reproducible,
      # and the job that builds a shippable APK must not silently resolve a
      # different dependency tree than the one that was reviewed.
      - name: Install app dependencies
        working-directory: packages/mobile
        run: npm ci

      - name: Typecheck against real Expo and React Native types
        working-directory: packages/mobile
        run: npx tsc --noEmit

      # A typecheck does not prove Metro can resolve the local workspace
      # package or the native modules; bundling does.
      - name: Bundle with Metro
        working-directory: packages/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Generate the native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --no-install --clean

      # The lock-screen call depends on manifest attributes a config plugin
      # patches in. If the plugin silently stops applying, calls quietly become
      # ordinary banners - so assert on the generated manifest.
      - name: Verify the generated manifest
        run: ./scripts/check-android-manifest.sh packages/mobile/android/app/src/main/AndroidManifest.xml

      # Shrinks the wrapper download and gives it a realistic timeout. Run
      # after prebuild, which regenerates the wrapper properties.
      - name: Prepare the Gradle wrapper
        run: ./scripts/prepare-gradle.sh packages/mobile/android/gradle/wrapper/gradle-wrapper.properties

      # Caches the Gradle distribution and dependency jars between runs, so a
      # reset connection to services.gradle.org is survivable rather than fatal.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Kotlin errors in the local module only surface at compile time, and
      # nothing else in CI compiles it.
      - name: Compile the native call module
        working-directory: packages/mobile/android
        run: ./gradlew :notifyjs-call:assembleRelease --no-daemon

  package:
    name: Hub binary smoke test
    runs-on: ubuntu-latest
    # See the note above `jobs:`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # A bundle can compile cleanly and still produce an executable that
      # cannot start - a stray second shebang was enough to do it once. The
      # only way to know is to run the packaged artifact.
      - name: Bundle and package
        run: |
          node scripts/bundle.mjs
          node scripts/package.mjs --target node20-linux-x64 --name notifyjs-linux-x64

      - name: Run the packaged binary
        run: |
          mkdir -p /tmp/smoke
          tar xzf build/artifacts/notifyjs-linux-x64.tar.gz -C /tmp/smoke
          cd /tmp/smoke/notifyjs

          ./notifyjs help > /dev/null
          ./notifyjs serve --port 7799 --data ./hub > serve.log 2>&1 &

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7799/health > /dev/null && break
            sleep 1
          done

          echo "--- hub log ---"
          cat serve.log

          # The dashboard must be served from the directory beside the binary,
          # since a packaged build cannot resolve @osqd/notifyjs-web as a module.
          curl -sf http://127.0.0.1:7799/health > /dev/null
          curl -sf http://127.0.0.1:7799/ > /dev/null
          curl -sf http://127.0.0.1:7799/app.js -o /tmp/app.js

          # Serving the file is not the same as the browser being able to run
          # it. A stale import rewrite once shipped an app.js that 200s here and
          # throws on load, because its specifier is one no browser can resolve.
          if grep -nE "^(import|export)[^'\"]*from ['\"][^./]" /tmp/app.js; then
            echo "dashboard has a bare import specifier; it will not load" >&2
            exit 1
          fi

          grep -qE '[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}' serve.log

          echo "packaged binary serves a loadable dashboard and issues pairing codes"

  desktop:
    name: Desktop app packages
    runs-on: ubuntu-latest
    # See the note above `jobs:`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The desktop app resolves @osqd/notifyjs-protocol through
      # `file:../protocol`, whose entry point is that package's build output,
      # and its icons are rendered from assets/icon.svg rather than checked in.
      - run: npm run build

      - name: Install desktop dependencies
        working-directory: packages/desktop
        run: npm ci

      - name: Typecheck
        working-directory: packages/desktop
        run: npx tsc --noEmit

      # electron-builder packages `dist/`, it does not produce it. Every
      # `dist:*` script in this package is `npm run build && electron-builder`
      # for that reason, and calling the packager directly skipped the first
      # half - so on a clean checkout there was no `dist/main.js` to package
      # and the job failed on an app.asar missing its entry point.
      - name: Bundle main, preload and renderer
        working-directory: packages/desktop
        run: npm run build

      # `--dir` packages the app without building the installers: one Electron
      # download instead of four, and no AppImage or dpkg step. It still
      # validates the electron-builder configuration and the packaged tree,
      # which is where a mistake in either would otherwise wait until a release
      # to surface - on a Windows or macOS runner, hours from the change.
      - name: Package the app
        working-directory: packages/desktop
        run: npx electron-builder --linux --x64 --dir

      - name: The packaged app carries a launcher and its code
        working-directory: packages/desktop
        run: |
          test -x release/linux-unpacked/notifyjs-desktop
          test -f release/linux-unpacked/resources/app.asar
          echo "packaged desktop app looks complete"

  # ------------------------------------------------------------------
  # What a release would produce, without publishing any of it.
  #
  # CI never runs release.yml, so nothing here used to check that a tag would
  # still build: the first sign of a broken release was the release. Every
  # release binary cross-compiles from Linux, so all five targets fit on one
  # runner and a break surfaces in the change that caused it.
  #
  # The publishing half is deliberately not faked. `docker/login-action` needs
  # packages:write and `softprops/action-gh-release` needs contents:write, and
  # neither belongs in a job that runs on every pull request. What can be
  # checked without them is whether those actions still accept the inputs
  # release.yml passes - the failure a version bump actually causes, and the
  # one no CI job would otherwise reach, since four of the five release
  # actions are used nowhere else.
  # ------------------------------------------------------------------
  release-dry-run:
    name: A release would still build
    runs-on: ubuntu-latest
    # See the note above `jobs:`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/bundle.mjs

      # Every target the release publishes. pkg cross-compiles them all from
      # here, so a break in any one shows up in the pull request that caused it
      # rather than at the next tag.
      - name: Package every release target
        run: |
          set -euo pipefail
          node scripts/package.mjs --target node20-linux-x64   --name notifyjs-linux-x64
          node scripts/package.mjs --target node20-linux-arm64 --name notifyjs-linux-arm64
          node scripts/package.mjs --target node20-macos-x64   --name notifyjs-macos-x64
          node scripts/package.mjs --target node20-macos-arm64 --name notifyjs-macos-arm64
          node scripts/package.mjs --target node20-win-x64     --name notifyjs-windows-x64 --format zip
          ls -la build/artifacts

      - name: Every published artifact is present and not empty
        run: |
          set -euo pipefail
          for f in notifyjs-linux-x64.tar.gz notifyjs-linux-arm64.tar.gz \
                   notifyjs-macos-x64.tar.gz notifyjs-macos-arm64.tar.gz \
                   notifyjs-windows-x64.zip; do
            test -s "build/artifacts/$f" || { echo "missing or empty: $f" >&2; exit 1; }
            echo "  ok  $f"
          done

      # The two release-only actions that are side-effect free: qemu installs
      # binfmt handlers, metadata computes tags. Running them for real is the
      # closest thing to a rehearsal that a read-only token allows.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=dry-run

      - name: The tags a release would push
        run: echo "${{ steps.meta.outputs.tags }}"

      - name: Pinned actions still accept the inputs they are given
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/check-action-contracts.mjs .github/workflows/*.yml
          status=$?
          # 1 is a real incompatibility and fails. 2 means the check could not
          # reach the API - unknown is not the same as broken, and failing the
          # build over a rate limit would only teach people to ignore this.
          if [ "$status" = "2" ]; then
            echo "::warning::Could not verify every pinned action; see the log."
            exit 0
          fi
          exit "$status"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    # See the note above `jobs:`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: notifyjs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it
        run: |
          docker run -d --name nj -p 7741:7741 notifyjs:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7741/health > /dev/null && break
            sleep 1
          done
          docker logs nj
          curl -sf http://127.0.0.1:7741/health
          docker rm -f nj

      # The release publishes linux/amd64 *and* linux/arm64, and CI only ever
      # built the first - so an arm64-only failure could not be seen until a
      # tag was cut. It was: Node crashed under QEMU partway through `npm ci`,
      # and the build hung rather than failing.
      #
      # Cheap now that the build stage is pinned to the native platform. The
      # arm64 leg is a base image, three COPYs and two busybox commands, with
      # no Node executed under emulation at all.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Both published architectures build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Whether anything got worse, security-wise, in this branch.
  #
  # Everything here is differential, and deliberately so. An absolute gate on
  # this tree is red today - the mobile app carries Expo and React Native,
  # which between them have twenty-odd open advisories at any moment - and a
  # gate that is red on an unchanged tree is one everybody learns to merge
  # past. What blocks a merge is what *this branch* added.
  # ------------------------------------------------------------------
  security:
    name: Nothing got worse
    runs-on: ubuntu-latest
    # See the note above `jobs:`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      # CodeQL posts its findings to the code scanning API, and the step after
      # it reads them back to compare against the default branch.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check-audit.mjs builds a worktree of the base ref to audit, so the
          # base ref has to actually be in the clone.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      # No `npm ci`: `npm audit` resolves the lockfile against the registry and
      # never needs node_modules, which is the only reason auditing three
      # separate dependency trees twice each is affordable at all.
      - name: No dependency advisory this branch did not already inherit
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set +e
          node scripts/check-audit.mjs --base "origin/$BASE_REF" --severity high \
            . packages/desktop packages/mobile
          status=$?
          # 1 is a new advisory and fails. 2 means the comparison could not be
          # made - a missing ref, a registry that would not answer - and
          # unknown is not the same as broken.
          if [ "$status" = "2" ]; then
            echo "::warning::Could not compare advisories against origin/$BASE_REF; see the log."
            exit 0
          fi
          exit "$status"

      # The properties SECURITY.md claims for these workflows, checked rather
      # than asserted - and now that a green run merges itself, the claim about
      # `${{ }}` in a `run:` block is load-bearing.
      - name: Workflows are pinned, scoped, and free of shell injection
        run: node scripts/check-workflow-hardening.mjs .github/workflows/*.yml

      # Same check release-dry-run performs, but that job does not run for a
      # fork's pull request, and a moved action pin is exactly the kind of
      # change worth catching there.
      - name: Pinned actions still accept the inputs they are given
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/check-action-contracts.mjs .github/workflows/*.yml
          status=$?
          if [ "$status" = "2" ]; then
            echo "::warning::Could not verify every pinned action; see the log."
            exit 0
          fi
          exit "$status"

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          # The default suite is tuned to be quiet. This runs the security
          # queries and the correctness ones, which is the point of having it.
          queries: security-and-quality

      # No build step: CodeQL reads JavaScript and TypeScript straight from
      # source, so nothing third-party is compiled inside a job holding a token
      # that can write to the security events API.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript

      # `analyze` uploads findings; on its own it never fails a build, so an
      # automatic merge would sail past a fresh SQL injection alert without
      # comment. This is the gate. Same differential shape as the audit above:
      # what fails is a high or critical alert on this branch that the default
      # branch does not already have, keyed by rule and file so that moving
      # code around does not read as a new finding.
      - name: No code scanning alert this branch introduced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Code scanning indexes results by the ref they were analysed on,
          # and for a pull request that is the merge ref, not the branch -
          # asking for a fork's branch name would 404 and read as "clean".
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || format('refs/heads/{0}', github.ref_name) }}
          BASE_REF: refs/heads/${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          alerts() {
            gh api --paginate \
              "/repos/$REPO/code-scanning/alerts?ref=$1&state=open&per_page=100" \
              --jq '.[]
                    | select(.rule.security_severity_level == "high"
                          or .rule.security_severity_level == "critical")
                    | "\(.rule.id)\t\(.most_recent_instance.location.path)"' \
              2>/dev/null || true
          }

          if [ "$HEAD_REF" = "$BASE_REF" ]; then
            echo "This is the base branch; there is nothing to compare it to."
            exit 0
          fi

          head_alerts=$(alerts "$HEAD_REF" | sort -u)
          if [ -z "$head_alerts" ]; then
            echo "No high or critical code scanning alert on $HEAD_REF."
            exit 0
          fi

          base_alerts=$(alerts "$BASE_REF" | sort -u)
          if [ -z "$base_alerts" ]; then
            # Either the base is genuinely clean or it has never been scanned,
            # and those are not the same thing. Guessing the second would let a
            # real finding through, so say so and let a person look.
            echo "::warning::No scan results for $BASE_REF to compare against;" \
                 "treating every alert on $HEAD_REF as pre-existing."
            echo "$head_alerts"
            exit 0
          fi

          introduced=$(comm -23 <(echo "$head_alerts") <(echo "$base_alerts"))
          if [ -n "$introduced" ]; then
            echo "::error::This branch introduces code scanning alerts $BASE_REF does not have:"
            echo "$introduced"
            exit 1
          fi
          echo "Every alert on $HEAD_REF is already present on $BASE_REF."

  # ------------------------------------------------------------------
  # The merge.
  #
  # Reached only when every job above succeeded, which is what makes this the
  # gate rather than a second opinion. It lives in this workflow rather than in
  # a `workflow_run` listener for one practical reason: `workflow_run` always
  # runs the copy of the file on the default branch, so a change to the merge
  # rules could never be tested before being merged by the rules it replaces.
  #
  # Only this job holds a write token, and it runs no third-party code - just
  # the `gh` CLI already on the runner.
  # ------------------------------------------------------------------
  merge:
    name: Merge into ${{ github.event.repository.default_branch }}
    needs: [test, mobile, package, desktop, release-dry-run, docker, security]
    if: >-
      github.event_name == 'push'
      && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      # Squashing the pull request writes to the default branch.
      contents: write
      pull-requests: write
      # A push made with GITHUB_TOKEN starts no workflow, so main would be
      # merged into and then never built, scanned or released. This job
      # dispatches both afterwards, and dispatching needs this.
      actions: write
    steps:
      - name: Merge the pull request for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # `gh` has jq compiled in, so `--jq` needs no jq on the runner - and
          # one call returning tab-separated fields beats four calls asking the
          # same question about the same pull request.
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$BASE" \
                 --state open --limit 1 \
                 --json number,isDraft,headRefOid,labels \
                 --jq '.[] | [.number, .isDraft, .headRefOid,
                              ([.labels[].name] | join(" "))] | @tsv')

          if [ -z "$pr" ]; then
            echo "::notice::No open pull request for $BRANCH; nothing to merge."
            exit 0
          fi
          IFS=$'\t' read -r number is_draft head labels <<< "$pr"

          # A draft is how you say "run the checks, do not land it yet".
          if [ "$is_draft" = "true" ]; then
            echo "::notice::#$number is a draft; marking it ready is what merges it."
            exit 0
          fi

          # And a label is how you say it about a pull request already open.
          case " $(printf '%s' "$labels" | tr '[:upper:]' '[:lower:]') " in
            *" hold "*|*" no-auto-merge "*)
              echo "::notice::#$number is held by a label; leaving it alone."
              exit 0
              ;;
          esac

          # The commit this run actually built. If the branch has moved since,
          # merging now would land code no job here ever saw; the run for the
          # newer commit is the one entitled to merge it.
          if [ "$head" != "$SHA" ]; then
            echo "::notice::$BRANCH moved to ${head:0:8} while this run was building ${SHA:0:8}; leaving the newer run to decide."
            exit 0
          fi

          echo "Merging #$number into $BASE."
          gh pr merge "$number" --repo "$REPO" --squash

          # Recorded before the branch is deleted, and deliberately so. These
          # were one `gh pr merge --squash --delete-branch`, which meant a
          # deletion that failed - a protected ref, one somebody had already
          # removed, a transient API error - exited non-zero *after* the merge
          # had landed. The step failed, this output was never written, and the
          # dispatch below never ran: the change was on the default branch and
          # nothing built, versioned or released it.
          echo "merged=true" >> "$GITHUB_OUTPUT"

          # Best effort from here. The merge is the part that matters; a branch
          # left behind is untidy, not broken, and is worth a warning rather
          # than a red run over a change that has already landed.
          if err=$(gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>&1); then
            echo "Deleted $BRANCH."
          else
            echo "::warning::Merged #$number, but could not delete $BRANCH: $err"
          fi
        id: merge

      # The merge above was made with GITHUB_TOKEN, so it triggered nothing.
      # Without these two, main is a branch that is written to and never built,
      # its rolling release goes stale, and CodeQL never records the baseline
      # the next branch is compared against. `workflow_dispatch` is the one
      # event GITHUB_TOKEN is allowed to raise, which is why it exists on both.
      #
      # Version, not Release: it reads what just landed, decides whether that
      # is a release at all, and dispatches Release itself either way - onto a
      # new tag if the merge carried a `Feat:` or a `Fix:`, onto the default
      # branch if it only carried `CI:`.
      - name: Build the default branch, and version what just landed
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml      --repo "$REPO" --ref "$BASE"
          gh workflow run version.yml --repo "$REPO" --ref "$BASE"
          echo "Dispatched CI and Version on $BASE."
