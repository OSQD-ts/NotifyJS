name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the repository. Stated explicitly because the
# default token permissions are a repository-level setting: without this, what
# `npm ci`, `expo prebuild` and `gradlew` run with depends on a checkbox
# somewhere else, and all three execute third-party code.
permissions:
  contents: read

# Cancel superseded runs so a burst of pushes does not queue behind itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to the commit they resolved to, not to a tag.
# A tag is a mutable pointer the action's owner can move: anyone who can retag
# can change what runs here, and this workflow holds the publishing
# credentials. The trailing comment is the human-readable version; update both
# together. Nothing bumps these automatically, so `check-action-contracts.mjs`
# is what catches a SHA that was edited to something that no longer fits.

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Test
        run: npm test

  mobile:
    name: Mobile app typecheck and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The app resolves @osqd/notifyjs-protocol through `file:../protocol`, whose
      # entry point is its build output.
      - run: npm run build

      # `ci`, not `install`: the lockfile is what makes this build reproducible,
      # and the job that builds a shippable APK must not silently resolve a
      # different dependency tree than the one that was reviewed.
      - name: Install app dependencies
        working-directory: packages/mobile
        run: npm ci

      - name: Typecheck against real Expo and React Native types
        working-directory: packages/mobile
        run: npx tsc --noEmit

      # A typecheck does not prove Metro can resolve the local workspace
      # package or the native modules; bundling does.
      - name: Bundle with Metro
        working-directory: packages/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Generate the native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --no-install --clean

      # The lock-screen call depends on manifest attributes a config plugin
      # patches in. If the plugin silently stops applying, calls quietly become
      # ordinary banners - so assert on the generated manifest.
      - name: Verify the generated manifest
        run: ./scripts/check-android-manifest.sh packages/mobile/android/app/src/main/AndroidManifest.xml

      # Shrinks the wrapper download and gives it a realistic timeout. Run
      # after prebuild, which regenerates the wrapper properties.
      - name: Prepare the Gradle wrapper
        run: ./scripts/prepare-gradle.sh packages/mobile/android/gradle/wrapper/gradle-wrapper.properties

      # Caches the Gradle distribution and dependency jars between runs, so a
      # reset connection to services.gradle.org is survivable rather than fatal.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Kotlin errors in the local module only surface at compile time, and
      # nothing else in CI compiles it.
      - name: Compile the native call module
        working-directory: packages/mobile/android
        run: ./gradlew :notifyjs-call:assembleRelease --no-daemon

  package:
    name: Hub binary smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # A bundle can compile cleanly and still produce an executable that
      # cannot start - a stray second shebang was enough to do it once. The
      # only way to know is to run the packaged artifact.
      - name: Bundle and package
        run: |
          node scripts/bundle.mjs
          node scripts/package.mjs --target node20-linux-x64 --name notifyjs-linux-x64

      - name: Run the packaged binary
        run: |
          mkdir -p /tmp/smoke
          tar xzf build/artifacts/notifyjs-linux-x64.tar.gz -C /tmp/smoke
          cd /tmp/smoke/notifyjs

          ./notifyjs help > /dev/null
          ./notifyjs serve --port 7799 --data ./hub > serve.log 2>&1 &

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7799/health > /dev/null && break
            sleep 1
          done

          echo "--- hub log ---"
          cat serve.log

          # The dashboard must be served from the directory beside the binary,
          # since a packaged build cannot resolve @osqd/notifyjs-web as a module.
          curl -sf http://127.0.0.1:7799/health > /dev/null
          curl -sf http://127.0.0.1:7799/ > /dev/null
          curl -sf http://127.0.0.1:7799/app.js -o /tmp/app.js

          # Serving the file is not the same as the browser being able to run
          # it. A stale import rewrite once shipped an app.js that 200s here and
          # throws on load, because its specifier is one no browser can resolve.
          if grep -nE "^(import|export)[^'\"]*from ['\"][^./]" /tmp/app.js; then
            echo "dashboard has a bare import specifier; it will not load" >&2
            exit 1
          fi

          grep -qE '[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}' serve.log

          echo "packaged binary serves a loadable dashboard and issues pairing codes"

  desktop:
    name: Desktop app packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The desktop app resolves @osqd/notifyjs-protocol through
      # `file:../protocol`, whose entry point is that package's build output,
      # and its icons are rendered from assets/icon.svg rather than checked in.
      - run: npm run build

      - name: Install desktop dependencies
        working-directory: packages/desktop
        run: npm ci

      - name: Typecheck
        working-directory: packages/desktop
        run: npx tsc --noEmit

      # electron-builder packages `dist/`, it does not produce it. Every
      # `dist:*` script in this package is `npm run build && electron-builder`
      # for that reason, and calling the packager directly skipped the first
      # half - so on a clean checkout there was no `dist/main.js` to package
      # and the job failed on an app.asar missing its entry point.
      - name: Bundle main, preload and renderer
        working-directory: packages/desktop
        run: npm run build

      # `--dir` packages the app without building the installers: one Electron
      # download instead of four, and no AppImage or dpkg step. It still
      # validates the electron-builder configuration and the packaged tree,
      # which is where a mistake in either would otherwise wait until a release
      # to surface - on a Windows or macOS runner, hours from the change.
      - name: Package the app
        working-directory: packages/desktop
        run: npx electron-builder --linux --x64 --dir

      - name: The packaged app carries a launcher and its code
        working-directory: packages/desktop
        run: |
          test -x release/linux-unpacked/notifyjs-desktop
          test -f release/linux-unpacked/resources/app.asar
          echo "packaged desktop app looks complete"

  # ------------------------------------------------------------------
  # What a release would produce, without publishing any of it.
  #
  # CI never runs release.yml, so nothing here used to check that a tag would
  # still build: the first sign of a broken release was the release. Every
  # release binary cross-compiles from Linux, so all five targets fit on one
  # runner and a break surfaces in the change that caused it.
  #
  # The publishing half is deliberately not faked. `docker/login-action` needs
  # packages:write and `softprops/action-gh-release` needs contents:write, and
  # neither belongs in a job that runs on every pull request. What can be
  # checked without them is whether those actions still accept the inputs
  # release.yml passes - the failure a version bump actually causes, and the
  # one no CI job would otherwise reach, since four of the five release
  # actions are used nowhere else.
  # ------------------------------------------------------------------
  release-dry-run:
    name: A release would still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/bundle.mjs

      # Every target the release publishes. pkg cross-compiles them all from
      # here, so a break in any one shows up in the pull request that caused it
      # rather than at the next tag.
      - name: Package every release target
        run: |
          set -euo pipefail
          node scripts/package.mjs --target node20-linux-x64   --name notifyjs-linux-x64
          node scripts/package.mjs --target node20-linux-arm64 --name notifyjs-linux-arm64
          node scripts/package.mjs --target node20-macos-x64   --name notifyjs-macos-x64
          node scripts/package.mjs --target node20-macos-arm64 --name notifyjs-macos-arm64
          node scripts/package.mjs --target node20-win-x64     --name notifyjs-windows-x64 --format zip
          ls -la build/artifacts

      - name: Every published artifact is present and not empty
        run: |
          set -euo pipefail
          for f in notifyjs-linux-x64.tar.gz notifyjs-linux-arm64.tar.gz \
                   notifyjs-macos-x64.tar.gz notifyjs-macos-arm64.tar.gz \
                   notifyjs-windows-x64.zip; do
            test -s "build/artifacts/$f" || { echo "missing or empty: $f" >&2; exit 1; }
            echo "  ok  $f"
          done

      # The two release-only actions that are side-effect free: qemu installs
      # binfmt handlers, metadata computes tags. Running them for real is the
      # closest thing to a rehearsal that a read-only token allows.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=dry-run

      - name: The tags a release would push
        run: echo "${{ steps.meta.outputs.tags }}"

      - name: Pinned actions still accept the inputs they are given
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/check-action-contracts.mjs .github/workflows/*.yml
          status=$?
          # 1 is a real incompatibility and fails. 2 means the check could not
          # reach the API - unknown is not the same as broken, and failing the
          # build over a rate limit would only teach people to ignore this.
          if [ "$status" = "2" ]; then
            echo "::warning::Could not verify every pinned action; see the log."
            exit 0
          fi
          exit "$status"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: notifyjs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it
        run: |
          docker run -d --name nj -p 7741:7741 notifyjs:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7741/health > /dev/null && break
            sleep 1
          done
          docker logs nj
          curl -sf http://127.0.0.1:7741/health
          docker rm -f nj
