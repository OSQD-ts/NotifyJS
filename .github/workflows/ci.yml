name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so a burst of pushes does not queue behind itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Test
        run: npm test

  mobile:
    name: Mobile app typecheck and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The app resolves @notifyjs/protocol through `file:../protocol`, whose
      # entry point is its build output.
      - run: npm run build

      - name: Install app dependencies
        working-directory: packages/mobile
        run: npm install

      - name: Typecheck against real Expo and React Native types
        working-directory: packages/mobile
        run: npx tsc --noEmit

      # A typecheck does not prove Metro can resolve the local workspace
      # package or the native modules; bundling does.
      - name: Bundle with Metro
        working-directory: packages/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Generate the native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --no-install --clean

      # The lock-screen call depends on manifest attributes a config plugin
      # patches in. If the plugin silently stops applying, calls quietly become
      # ordinary banners - so assert on the generated manifest.
      - name: Verify the generated manifest
        working-directory: packages/mobile/android/app/src/main
        run: |
          grep -q 'android:showWhenLocked="true"' AndroidManifest.xml \
            || { echo "MainActivity cannot show over the keyguard"; exit 1; }
          grep -q 'android:turnScreenOn="true"' AndroidManifest.xml \
            || { echo "MainActivity will not wake the screen"; exit 1; }
          grep -q 'USE_FULL_SCREEN_INTENT' AndroidManifest.xml \
            || { echo "full-screen intent permission is missing"; exit 1; }
          grep -q 'usesCleartextTraffic="true"' AndroidManifest.xml \
            || { echo "ws:// to a LAN hub would be blocked"; exit 1; }
          grep -q 'RECORD_AUDIO' AndroidManifest.xml \
            && { echo "RECORD_AUDIO leaked back in"; exit 1; } || true

      # Kotlin errors in the local module only surface at compile time, and
      # nothing else in CI compiles it.
      - name: Compile the native call module
        working-directory: packages/mobile/android
        run: ./gradlew :notifyjs-call:assembleRelease --no-daemon

  package:
    name: Packaged binary smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # A bundle can compile cleanly and still produce an executable that
      # cannot start - a stray second shebang was enough to do it once. The
      # only way to know is to run the packaged artifact.
      - name: Bundle and package
        run: |
          node scripts/bundle.mjs
          node scripts/package.mjs --target node20-linux-x64 --name notifyjs-linux-x64

      - name: Run the packaged binary
        run: |
          mkdir -p /tmp/smoke
          tar xzf build/artifacts/notifyjs-linux-x64.tar.gz -C /tmp/smoke
          cd /tmp/smoke/notifyjs

          ./notifyjs help > /dev/null
          ./notifyjs serve --port 7799 --data ./hub > serve.log 2>&1 &

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7799/health > /dev/null && break
            sleep 1
          done

          echo "--- hub log ---"
          cat serve.log

          # The dashboard must be served from the directory beside the binary,
          # since a packaged build cannot resolve @notifyjs/web as a module.
          curl -sf http://127.0.0.1:7799/health > /dev/null
          curl -sf http://127.0.0.1:7799/ > /dev/null
          curl -sf http://127.0.0.1:7799/app.js > /dev/null
          grep -qE '[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}' serve.log

          echo "packaged binary serves the dashboard and issues pairing codes"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: notifyjs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it
        run: |
          docker run -d --name nj -p 7741:7741 notifyjs:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7741/health > /dev/null && break
            sleep 1
          done
          docker logs nj
          curl -sf http://127.0.0.1:7741/health
          docker rm -f nj
