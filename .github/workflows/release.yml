name: Release

on:
  push:
    tags: ['v*']
    # Every push to the default branch refreshes a rolling "latest" release, so
    # there is always a build people can download without waiting for a tag.
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.1.0). Produces a draft release.'
        required: true

# Least privilege by default. Only the jobs that actually publish something
# widen this, and they do it themselves: every other job runs `npm ci`,
# `expo prebuild` and `gradlew`, all of which execute third-party code, and
# none of them has any business holding a token that can write to the repo.
permissions:
  contents: read

# A tag builds that version; a branch push builds a rolling prerelease.
env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  NOTIFYJS_VERSION: >-
    ${{ github.event.inputs.version
        || (startsWith(github.ref, 'refs/tags/v') && github.ref_name)
        || 'latest' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to the commit they resolved to, not to a tag.
# A tag is a mutable pointer the action's owner can move: anyone who can retag
# can change what runs here, and this workflow holds the publishing
# credentials. The trailing comment is the human-readable version; update both
# together (Dependabot understands this form).

jobs:
  # ---------------------------------------------------------------------
  # The dispatch input is the one value here a person types, and it reaches a
  # shell, a filename and an npm publish. Checked once, up front, so every
  # later job can treat it as a version rather than as arbitrary text.
  # ---------------------------------------------------------------------
  validate:
    name: Validate the requested version
    runs-on: ubuntu-latest
    steps:
      - name: Check the version string
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          if [ -z "$REQUESTED" ]; then
            echo "Not a manual dispatch; the version comes from the ref."
            exit 0
          fi
          # A tag-shaped version and nothing else: no whitespace, no shell
          # metacharacters, no newline that could forge a step output.
          if ! printf '%s' "$REQUESTED" \
            | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$REQUESTED' is not a version like v1.2.3"
            exit 1
          fi
          echo "version looks well formed"

  # ---------------------------------------------------------------------
  # SERVER. Standalone hub executables - the process an app publishes to and
  # the clients subscribe to. pkg cross-compiles every target from one Linux
  # runner, so there is no need for a per-OS matrix of machines.
  #
  # These asset names are load-bearing. A hub that updates itself matches them
  # with `notifyjs-<os>-<arch>.(tar.gz|zip)` (packages/cli/src/selfupdate.ts),
  # so renaming one silently strands every binary already installed. That is
  # why the split between servers and clients lives in the release notes and
  # in the client names, and leaves these alone.
  # ---------------------------------------------------------------------
  binaries:
    needs: validate
    name: Server binary ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: node20-linux-x64
            name: notifyjs-linux-x64
            format: tar.gz
          - target: node20-linux-arm64
            name: notifyjs-linux-arm64
            format: tar.gz
          - target: node20-macos-x64
            name: notifyjs-macos-x64
            format: tar.gz
          - target: node20-macos-arm64
            name: notifyjs-macos-arm64
            format: tar.gz
          - target: node20-win-x64
            name: notifyjs-windows-x64
            format: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # These are workflow literals rather than anything a person types, but
      # they go through the environment like everything else: "no ${{ }} inside
      # a run block" is a rule that can be checked at a glance, where "no
      # ${{ }} except the safe ones" is a judgement call on every edit.
      - name: Bundle and package
        env:
          TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.name }}
          FORMAT: ${{ matrix.format }}
        run: |
          node scripts/bundle.mjs
          node scripts/package.mjs \
            --target "$TARGET" \
            --name "$ASSET_NAME" \
            --format "$FORMAT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: build/artifacts/${{ matrix.name }}.${{ matrix.format }}
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # CLIENT. The desktop app, as a real installer for each platform.
  #
  # This is the one job that has to pay for a per-OS matrix of machines: a
  # .dmg needs macOS to build the disk image, and an NSIS installer needs
  # Windows. Only Linux could have been cross-built, and keeping it in the
  # same matrix costs nothing.
  # ---------------------------------------------------------------------
  desktop:
    needs: validate
    name: Desktop client (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            script: dist:linux
          - os: macos
            runner: macos-latest
            script: dist:mac
          - os: windows
            runner: windows-latest
            script: dist:win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Two things the desktop build cannot start without. It depends on
      # @osqd/notifyjs-protocol through `file:../protocol`, whose entry point is
      # that package's build output; and its icons are rendered from
      # assets/icon.svg rather than checked in, which is the single PNG
      # electron-builder turns into .icns, .ico and the Linux icon set.
      - name: Build workspace packages
        run: npm run build

      # `ci`, not `install`: this job produces an installer people run, so the
      # dependency tree behind it has to be the one in the lockfile.
      - name: Install desktop dependencies
        working-directory: packages/desktop
        run: npm ci

      # packages/desktop is private, so set-version.mjs never touches it - but
      # its version is what the app reports to a hub and shows in its settings.
      # Only for a tag: `latest` is not a version electron-builder, or any of
      # the three installer formats, will accept, so a rolling build keeps
      # whatever the manifest says.
      - name: Stamp the release version
        if: env.IS_TAG == 'true'
        shell: bash
        env:
          VERSION: ${{ env.NOTIFYJS_VERSION }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "packages/desktop/package.json";
            const json = JSON.parse(fs.readFileSync(path, "utf8"));
            json.version = process.env.VERSION.replace(/^v/, "");
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + "\n");
            console.log("desktop is now " + json.version);
          '

      # These builds are unsigned. Left to itself electron-builder signs with
      # whatever certificate happens to be in the runner's keychain, which
      # produces a build nobody else can reproduce.
      - name: Build the installers
        working-directory: packages/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SCRIPT: ${{ matrix.script }}
        run: npm run "$SCRIPT"

      # Named extensions rather than the whole directory: electron-builder also
      # writes builder-debug.yml and .blockmap sidecars, which are build
      # detritus rather than anything to publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notifyjs-desktop-${{ matrix.os }}
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # CLIENT. Android APK, for sideloading onto a phone.
  # ---------------------------------------------------------------------
  android:
    name: Android client (APK)
    needs: validate
    runs-on: ubuntu-latest
    # Best effort: a broken native build must not hold back the hub binaries,
    # which are what most people are downloading.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - run: npm ci

      # The app depends on @osqd/notifyjs-protocol through `file:../protocol`, whose
      # entry point is its build output - so the workspace must be built before
      # the app's own install can resolve it.
      - name: Build workspace packages
        run: npm run build

      # `ci`, not `install`: this job signs and ships an APK, so the dependency
      # tree it builds from has to be the one in the lockfile.
      - name: Install app dependencies
        working-directory: packages/mobile
        run: npm ci

      - name: Generate the native Android project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --no-install --clean

      # These fail silently at runtime rather than at build time, so assert on
      # them explicitly. See the script for what each one protects.
      - name: Verify the generated manifest
        run: ./scripts/check-android-manifest.sh packages/mobile/android/app/src/main/AndroidManifest.xml

      # Optional real signing. Without these secrets the APK is signed with the
      # debug key, which installs fine for sideloading but cannot be published
      # to Play and is not upgradeable from a differently-signed build.
      - name: Configure release signing
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No release keystore configured; the APK will be debug-signed."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> gradle.properties

      # Shrinks the wrapper download and gives it a realistic timeout. Run
      # after prebuild, which regenerates the wrapper properties.
      - name: Prepare the Gradle wrapper
        run: ./scripts/prepare-gradle.sh packages/mobile/android/gradle/wrapper/gradle-wrapper.properties

      # Caches the Gradle distribution and dependency jars between runs, so a
      # reset connection to services.gradle.org is survivable rather than fatal.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Assemble release APK
        working-directory: packages/mobile/android
        # One retry: the remaining failure mode after caching is a transient
        # network blip, and a second attempt costs far less than a lost release.
        run: |
          ./gradlew assembleRelease --no-daemon \
            || { echo "retrying once..."; ./gradlew assembleRelease --no-daemon; }

      # The merged manifest inside the APK is the only definitive answer about
      # what the app actually asks for.
      - name: Verify the shipped APK
        run: |
          ./scripts/check-android-manifest.sh \
            packages/mobile/android/app/src/main/AndroidManifest.xml \
            packages/mobile/android/app/build/outputs/apk/release/app-release.apk

      # Passed through the environment rather than pasted into the script.
      # `${{ }}` is substituted as text before the shell ever sees the line, so
      # an expression carrying a quote or a semicolon becomes shell syntax; a
      # variable reference cannot.
      - name: Name the APK after the release
        env:
          VERSION: ${{ env.NOTIFYJS_VERSION }}
        run: |
          mkdir -p build/artifacts
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "build/artifacts/notifyjs-android-${VERSION}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notifyjs-android
          path: build/artifacts/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # SERVER. The dashboard on its own, for anyone serving it from their own web
  # server instead of from the hub.
  # ---------------------------------------------------------------------
  dashboard:
    name: Dashboard bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Zip the dashboard
        run: |
          node scripts/bundle.mjs
          mkdir -p build/artifacts
          cd build && zip -r -q artifacts/notifyjs-dashboard.zip dashboard

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notifyjs-dashboard
          path: build/artifacts/notifyjs-dashboard.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Container image for running the hub as a service.
  # ---------------------------------------------------------------------
  container:
    name: Container image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing the image to ghcr.io is the only reason this job exists.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          # Nothing consumes the build record, and it is the artifact that
          # broke the release job when collected alongside the real ones.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # npm packages.
  #
  # A push to the default branch publishes a prerelease under the `next` tag;
  # a version tag publishes the real thing under `latest`. Every push needs a
  # version npm has not seen before, so main builds carry the run number - and
  # `next` keeps them from becoming what `npm install` gives people by default.
  # ---------------------------------------------------------------------
  npm:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which attests that these bytes were built
      # by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Decide the version to publish
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [ "$IS_TAG" = "true" ]; then
            VERSION="${NOTIFYJS_VERSION#v}"
            TAG=latest
          else
            # Unique per run and ordered, so a later build always wins.
            VERSION="${BASE}-main.${RUN_NUMBER}"
            TAG=next
          fi
          # A step output is parsed line by line, so a newline in $VERSION would
          # forge additional outputs for every later step that reads them.
          case "$VERSION" in
            *[!0-9A-Za-z.+-]* | '')
              echo "::error::refusing to publish a version containing '$VERSION'"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION under the '$TAG' tag"

      - name: Stamp the version across the workspace
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/set-version.mjs "$VERSION"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping publish."
            exit 0
          fi
          # Dependency order: a package must not be published before something
          # it depends on, or an install between the two resolves nothing.
          for pkg in protocol web core cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            echo "::group::$name"
            # Republishing an existing version is an error, not a failure -
            # a re-run of the same workflow should be a no-op, not a red X.
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "already published, skipping"
            else
              npm publish --workspace "$name" \
                --tag "$DIST_TAG" \
                --access public \
                --provenance
            fi
            echo "::endgroup::"
          done

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          {
            echo "### Published \`$VERSION\` to npm"
            echo
            echo "Installed by default: \`npm i @osqd/notifyjs\`"
            if [ "$DIST_TAG" = "next" ]; then
              echo
              echo "This is a rolling build. \`npm i @osqd/notifyjs@next\` to get it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Collect everything into one GitHub Release.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    needs: [validate, binaries, desktop, android, dashboard]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Only this workflow's own artifacts. Without the pattern the step also
      # picks up the `.dockerbuild` build record that docker/build-push-action
      # uploads, which is not a plain zip and fails extraction - taking the
      # whole release down with it after every build had already succeeded.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: notifyjs-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          NOTIFYJS_VERSION: ${{ env.NOTIFYJS_VERSION }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="$NOTIFYJS_VERSION"
          APK=$(cd dist && ls *.apk 2>/dev/null | head -1)

          # The APK job is best-effort, so the table has to render either way.
          if [ -n "$APK" ]; then
            APK_CELL="\`$APK\`"
          else
            APK_CELL="not built for this release"
          fi

          # Container registries reject uppercase in image names.
          IMAGE=$(echo "ghcr.io/${REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          if [ "$IS_TAG" = "true" ]; then
            HEADER="Release $VERSION"
          else
            HEADER="Rolling build from \`${COMMIT}\` on $(date -u '+%Y-%m-%d %H:%M UTC'). Replaced on every push to the default branch."
          fi

          cat > notes.md <<NOTES
          $HEADER

          Two kinds of download here, and a working setup needs one of each.
          A **client** is what alerts you: the app on the machine or phone in
          front of you. A **server** is the hub your own code publishes to,
          and the thing every client subscribes to. They do not have to be on
          the same machine, and one hub happily feeds every client you own.

          ## Clients

          | Platform | File |
          | --- | --- |
          | Windows (x64) | \`notifyjs-desktop-windows-x64-setup.exe\` |
          | macOS (Apple silicon) | \`notifyjs-desktop-macos-arm64.dmg\` |
          | macOS (Intel) | \`notifyjs-desktop-macos-x64.dmg\` |
          | Linux (x64) | \`notifyjs-desktop-linux-x86_64.AppImage\`, \`notifyjs-desktop-linux-amd64.deb\` |
          | Linux (arm64) | \`notifyjs-desktop-linux-arm64.AppImage\`, \`notifyjs-desktop-linux-arm64.deb\` |
          | Android (phone) | ${APK_CELL} |

          Install it, open it, and pair by pasting the hub's pairing link or
          typing the twelve-character code it printed.

          The desktop app lives in the tray. Closing the window hides it and
          changes nothing about what is delivered — an alerting client that
          stops listening when you dismiss its window is not an alerting
          client — and the tray menu carries the connection count, a snooze,
          and the only real quit. **Start at login** is in Settings, next to
          **start hidden**, which is the setting you want if it is going to
          launch itself every morning.

          ### Windows

          Run the \`.exe\`. It installs for the current user, so it never asks
          for an administrator, and you can change the install directory on
          the way through. Uninstall from Settings → Apps like anything else.

          ### macOS

          Open the \`.dmg\` and drag NotifyJS into Applications. The app is
          unsigned, so Gatekeeper blocks the first launch: right-click it and
          choose **Open**, or clear the flag yourself.

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/NotifyJS.app
          \`\`\`

          ### Linux

          The AppImage is the whole install — it carries its own Electron:

          \`\`\`bash
          chmod +x notifyjs-desktop-linux-x86_64.AppImage
          ./notifyjs-desktop-linux-x86_64.AppImage
          \`\`\`

          The \`.deb\` is the better answer if you would rather have it
          system-wide and in the menu. It installs to \`/opt/NotifyJS\` and
          declares its GTK and libnotify dependencies, so apt catches a machine
          that is missing them:

          \`\`\`bash
          sudo dpkg -i notifyjs-desktop-linux-amd64.deb
          \`\`\`

          The executable is \`notifyjs-desktop\`, deliberately not
          \`notifyjs\` — that name belongs to the hub CLI below, and one of
          them shadowing the other on \`PATH\` would be a mean surprise.

          ### Android

          Download the \`.apk\` straight onto the phone and open it. Android
          will warn about an unknown source; allow it for your browser or file
          manager once. The APK is signed with a debug key unless release
          signing secrets are configured.

          After pairing, grant **notifications** and, when prompted, **full-screen
          alerts** — the second is what lets an incoming call take over a locked
          screen rather than appearing as a banner.

          ## Servers

          | Platform | File |
          | --- | --- |
          | Linux (x64) | \`notifyjs-linux-x64.tar.gz\` |
          | Linux (arm64) | \`notifyjs-linux-arm64.tar.gz\` |
          | macOS (Apple silicon) | \`notifyjs-macos-arm64.tar.gz\` |
          | macOS (Intel) | \`notifyjs-macos-x64.tar.gz\` |
          | Windows (x64) | \`notifyjs-windows-x64.zip\` |
          | Container | \`${IMAGE}\` |
          | Dashboard only | \`notifyjs-dashboard.zip\` |

          Nothing here needs Node.js installed.

          ### Run the hub

          \`\`\`bash
          tar xzf notifyjs-linux-x64.tar.gz
          cd notifyjs
          ./notifyjs serve --port 7741
          \`\`\`

          It prints a pairing code. Open <http://localhost:7741>, enter the
          code, and the browser becomes a connected device — the quickest way
          to check the hub works before installing anything else. Keep the
          \`dashboard\` directory next to the binary.

          ### Container

          \`\`\`bash
          docker run -d -p 7741:7741 -v notifyjs:/data \\
            ${IMAGE}:${VERSION#v}
          \`\`\`

          ### macOS

          The hub binaries are unsigned too, so clear the quarantine flag
          before running one:

          \`\`\`bash
          xattr -d com.apple.quarantine ./notifyjs
          \`\`\`

          ## Verify a download

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt --ignore-missing
          \`\`\`

          Read [SECURITY.md](https://github.com/${REPOSITORY}/blob/main/SECURITY.md)
          before exposing the hub to the internet.
          NOTES

          cat notes.md

      - name: Publish a versioned release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.NOTIFYJS_VERSION }}
          name: NotifyJS ${{ env.NOTIFYJS_VERSION }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Refresh the rolling build
        if: env.IS_TAG != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest build
          body_path: notes.md
          files: dist/*
          # Marked prerelease so it never outranks a tagged version, and
          # replaced wholesale each time rather than accumulating stale assets.
          prerelease: true
          make_latest: false
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true
