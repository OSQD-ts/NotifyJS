version: 2

# Pinning actions to commit SHAs removes the "the owner retagged v3" problem
# and creates a new one: nothing moves, including security fixes. This is the
# other half of that trade — Dependabot reads the `# v3` comment beside each
# pin, finds the newer release, and opens a PR that updates the SHA and the
# comment together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the routine bumps; anything major still arrives on its own,
      # because those are the ones worth reading.
      actions:
        update-types: [minor, patch]

  # The workspace. `sharp` and `esbuild` live here and both have had
  # advisories, so this is not a formality.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately: releases past this line resolve base binaries from
      # a cache tag with no prebuilt for the Node patch the runner uses, and
      # packaging silently falls back to compiling Node from source. Lift this
      # once upstream publishes them. See the review notes.
      #
      # This pin is why `npm audit` reports two low-severity findings, both the
      # same one: the esbuild nested under this package. Do not clear them with
      # `npm audit fix --force` - it bumps this package past the line above and
      # breaks the released binaries. The advisory is against esbuild's
      # development server on Windows, which nothing here runs: the packager
      # uses esbuild in-process as a bundler. The top-level esbuild, which the
      # dashboard and desktop builds actually use, is outside the affected
      # range and is updated normally by the group above.
      - dependency-name: '@yao-pkg/pkg'
        update-types: [version-update:semver-minor, version-update:semver-major]

  # The phone app keeps its own lockfile, and it is the tree a signed APK is
  # built from.
  - package-ecosystem: npm
    directory: /packages/mobile
    schedule:
      interval: weekly
    groups:
      expo:
        patterns: ['expo', 'expo-*', 'react-native']
        update-types: [minor, patch]
